name: Sync Scripts

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Validate Scripts
        run: |
          echo "验证脚本格式..."
          python3 -m py_compile *.py || true
          echo "验证完成"
